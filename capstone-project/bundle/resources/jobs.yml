# resources/jobs.yml
resources:
  jobs:
    retail_lakehouse_daily:
      name: retail_lakehouse_daily_${bundle.target}
      tags:
        project: capstone
        layer: orchestration
      email_notifications:
        on_failure:
          - you@example.com
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: >-
          ${bundle.target == "prod" ? "UNPAUSED" : "PAUSED"}
      tasks:
        - task_key: bronze_orders
          notebook_task:
            notebook_path: ../notebooks/01_bronze_orders_autoloader.py
          new_cluster: &small_job_cluster
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: bronze_customers_products
          notebook_task:
            notebook_path: ../notebooks/02_bronze_jdbc_customers_products.py
          new_cluster: *small_job_cluster
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver_pipeline
          depends_on:
            - task_key: bronze_orders
            - task_key: bronze_customers_products
          pipeline_task:
            pipeline_id: ${resources.pipelines.retail_silver_pipeline.id}
          timeout_seconds: 1800

        - task_key: gold_aggregates
          depends_on:
            - task_key: silver_pipeline
          notebook_task:
            notebook_path: ../notebooks/03_gold_aggregates.py
          new_cluster: *small_job_cluster
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 60000
