# databricks.yml
bundle:
  name: retail-lakehouse

include:
  - resources/*.yml

variables:
  notebook_root:
    description: Workspace path prefix for notebooks in this bundle
    default: /Workspace/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-xxxxxxxxxxxxxxx.xx.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev
    run_as:
      user_name: ${workspace.current_user.userName}

  prod:
    mode: production
    workspace:
      host: https://adb-xxxxxxxxxxxxxxx.xx.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/prod
    run_as:
      service_principal_name: <your-service-principal-application-id>
    permissions:
      - level: CAN_MANAGE
        group_name: admins
